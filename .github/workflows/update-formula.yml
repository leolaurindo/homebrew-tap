name: Update Homebrew formulae

on:
  workflow_dispatch:
    inputs:
      project:
        description: Formula to update, or all formulae
        required: true
        type: choice
        options:
          - all
          - gixt
        default: all

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update selected formulae
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
        run: python3 scripts/update-formula.py "$PROJECT"

      - name: Open formula update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "Update Homebrew formulae"
          branch: automation/update-homebrew-formulae
          delete-branch: true
          title: "Update Homebrew formulae"
          body: "Updates selected formulae to the latest project releases."
